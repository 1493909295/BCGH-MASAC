# Portable export of the Windows MYENV1 environment for a Linux x86_64
# server with an NVIDIA driver compatible with CUDA 12.6 (includes V100).
# Create on Linux with explicit download output (bash):
#   CONDA_QUIET=false CONDA_JSON=false CONDA_SHOW_CHANNEL_URLS=true \
#   PIP_CONFIG_FILE=/dev/null PIP_EXTRA_INDEX_URL= PIP_QUIET=0 \
#   PIP_PROGRESS_BAR=raw PIP_VERBOSE=1 \
#   conda env create -f req1.yml --no-default-packages --verbose
# Then: conda activate MYENV1
# Activation itself does not download packages. The variables below apply
# to subsequent installs after activation, not to the initial env creation.
# Conda may buffer pip output until the pip subprocess finishes; raw mode
# preserves byte-progress lines even when output is captured or redirected.
name: MYENV1

channels:
  - https://mirrors.tuna.tsinghua.edu.cn/anaconda/pkgs/main
  - nodefaults

variables:
  CONDA_QUIET: "false"
  CONDA_JSON: "false"
  CONDA_SHOW_CHANNEL_URLS: "true"
  PIP_CONFIG_FILE: /dev/null
  PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
  PIP_EXTRA_INDEX_URL: ""
  PIP_QUIET: "0"
  PIP_PROGRESS_BAR: raw
  PIP_VERBOSE: "1"

dependencies:
  - python=3.10.20
  - pip=26.0.1
  - setuptools=80.10.2
  - wheel=0.46.3
  - pip:
      - --index-url https://pypi.tuna.tsinghua.edu.cn/simple
      # Only these CUDA 12.6 wheels use PyTorch's official download host.
      # Direct URLs keep all other packages (including CUDA dependencies)
      # on TUNA; pip does not prioritize index-url over extra-index-url.
      # These wheels target Python 3.10 / Linux x86_64, as this export does.
      - torch @ https://download-r2.pytorch.org/whl/cu126/torch-2.10.0%2Bcu126-cp310-cp310-manylinux_2_28_x86_64.whl#sha256=a256b51e8ca00770a47fe7ab865e3211d2a080d4f1cdc814cdcfb073b36cf1a1
      - torchvision @ https://download-r2.pytorch.org/whl/cu126/torchvision-0.25.0%2Bcu126-cp310-cp310-manylinux_2_28_x86_64.whl#sha256=02525b6a66df95c2b2a8ef9fdfc006e979ae4673e02fb8ecb492d4bdb40ce5c9

      # Core numerical and plotting stack.
      - numpy==2.2.5
      - pandas==2.3.3
      - scipy==1.15.3
      - matplotlib==3.10.8
      - seaborn==0.13.2
