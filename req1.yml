# Portable export of the Windows MYENV1 environment for a Linux x86_64
# server with an NVIDIA driver compatible with CUDA 12.8.
# Create with: conda env create -f req1.yml
# Faster alternative: mamba env create -f req1.yml
name: MYENV1

channels:
  - defaults

dependencies:
  - python=3.10.20
  - pip=26.0.1
  - setuptools=80.10.2
  - wheel=0.46.3
  - pip:
      # CUDA-enabled PyTorch wheels matching the source environment.
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.11.0+cu128
      - torchvision==0.26.0+cu128

      # Core numerical and plotting stack.
      - numpy==2.2.5
      - pandas==2.3.3
      - scipy==1.15.3
      - matplotlib==3.10.8
      - seaborn==0.13.2
      - Bottleneck==1.4.2
      - numexpr==2.14.1
      - contourpy==1.3.2
      - cycler==0.12.1
      - fonttools==4.62.1
      - kiwisolver==1.5.0
      - packaging==25.0
      - pillow==12.1.1
      - pyparsing==3.3.2
      - python-dateutil==2.9.0.post0
      - pytz==2026.1.post1
      - six==1.17.0
      - tzdata==2025.3

      # RL environment and project framework.
      - gym==0.26.2
      - gym-notices==0.1.0
      - gymnasium==1.2.3
      - pettingzoo==1.25.0
      - xuance==1.4.1
      - cloudpickle==3.1.2
      - farama-notifications==0.0.4

      # Media/runtime packages present in MYENV1.
      - opencv-python-headless==4.13.0.92
      - pygame==2.6.1
      - pyglet==1.5.15
      - imageio==2.37.3
      - imageio-ffmpeg==0.6.0
      - moviepy==1.0.3
      - decorator==4.4.2
      - proglog==0.1.12

      # Training telemetry and utilities.
      - tensorboard==2.20.0
      - tensorboard-data-server==0.7.2
      - wandb==0.25.1
      - absl-py==2.4.0
      - annotated-types==0.7.0
      - certifi==2026.2.25
      - charset-normalizer==3.4.6
      - click==8.3.1
      - colorama==0.4.6
      - filelock==3.25.2
      - fsspec==2026.2.0
      - gitdb==4.0.12
      - GitPython==3.1.46
      - grpcio==1.78.0
      - idna==3.11
      - Jinja2==3.1.6
      - Markdown==3.10.2
      - MarkupSafe==3.0.2
      - mpmath==1.3.0
      - networkx==3.4.2
      - platformdirs==4.9.4
      - protobuf==6.33.6
      - pydantic==2.12.5
      - pydantic-core==2.41.5
      - PyYAML==6.0.3
      - requests==2.33.0
      - sentry-sdk==2.56.0
      - smmap==5.0.3
      - sympy==1.14.0
      - tqdm==4.67.3
      - typing-extensions==4.15.0
      - typing-inspection==0.4.2
      - urllib3==2.6.3
      - Werkzeug==3.1.7
